    function getITValue(itGrade, nominal) {
        let rangeIdx = 3;
        if (nominal <= 6) rangeIdx = 0;
        else if (nominal <= 10) rangeIdx = 1;
        else if (nominal <= 18) rangeIdx = 2;
        else if (nominal <= 30) rangeIdx = 3;
        else if (nominal <= 50) rangeIdx = 4;
        else if (nominal <= 80) rangeIdx = 5;
        else if (nominal <= 120) rangeIdx = 6;

        const IT_TABLE = {
            6: [8, 9, 11, 13, 16, 19, 22],
            7: [12, 15, 18, 21, 25, 30, 35],
            8: [18, 22, 27, 33, 39, 46, 54],
            9: [30, 36, 43, 52, 62, 74, 87],
            10: [48, 58, 70, 84, 100, 120, 140]
        };

        return (IT_TABLE[itGrade] && IT_TABLE[itGrade][rangeIdx]) ? IT_TABLE[itGrade][rangeIdx] : 25;
    }

    function calculateISODeviations(symbol, type, nominal) {
        const it = parseInt(symbol.replace(/[^0-9]/g, '')) || 7;
        const letter = symbol.replace(/[0-9]/g, '');
        const itVal = getITValue(it, nominal);

        let ES = 0, EI = 0;

        if (type === 'HOLE') {
            switch (letter) {
                case 'H': EI = 0; ES = itVal; break;
                case 'JS': ES = Math.round(itVal / 2); EI = -Math.round(itVal / 2); break;
                case 'K': ES = Math.round(itVal * 0.2); EI = ES - itVal; break;
                case 'N': ES = -Math.round(itVal * 0.3); EI = ES - itVal; break;
                case 'P': ES = -Math.round(itVal * 0.7); EI = ES - itVal; break;
                case 'F': EI = Math.round(itVal * 0.8); ES = EI + itVal; break;
                case 'G': EI = Math.round(itVal * 0.3); ES = EI + itVal; break;
                case 'E': EI = Math.round(itVal * 1.5); ES = EI + itVal; break;
                case 'D': EI = Math.round(itVal * 2.2); ES = EI + itVal; break;
                default: EI = 0; ES = itVal;
            }
        } else {
            switch (letter) {
                case 'h': ES = 0; EI = -itVal; break;
                case 'f': ES = -Math.round(itVal * 0.6); EI = ES - itVal; break;
                case 'g': ES = -Math.round(itVal * 0.25); EI = ES - itVal; break;
                case 'js': ES = Math.round(itVal / 2); EI = -Math.round(itVal / 2); break;
                case 'k': EI = Math.round(itVal * 0.1); ES = EI + itVal; break;
                case 'm': EI = Math.round(itVal * 0.4); ES = EI + itVal; break;
                case 'p': EI = Math.round(itVal * 0.8); ES = EI + itVal; break;
                case 'r': EI = Math.round(itVal * 1.3); ES = EI + itVal; break;
                case 's': EI = Math.round(itVal * 1.8); ES = EI + itVal; break;
                default: ES = 0; EI = -itVal;
            }
        }

        return {
            ES_um: ES,
            EI_um: EI,
            IT_um: itVal,
            ES_mm: ES / 1000,
            EI_mm: EI / 1000,
            IT_mm: itVal / 1000,
            dMax: nominal + (ES / 1000),
            dMin: nominal + (EI / 1000)
        };
    }

    function renderQuizEvaluation() {
        const container = document.getElementById('quiz-questions-container');
        if (!container) return;

        container.innerHTML = '';

        QUIZ_QUESTIONS.forEach((q, idx) => {
            const card = document.createElement('div');
            card.className = "fluent-card p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between space-y-3 bg-white";

            const selectedOpt = userQuizAnswers[q.id];

            let feedbackClass = "";
            if (isQuizSubmitted) {
                const isCorrect = selectedOpt && q.options.find(o => o.id === selectedOpt)?.correct;
                feedbackClass = isCorrect ? "border-emerald-400 bg-emerald-50/20" : "border-rose-400 bg-rose-50/20";
            }

            if (feedbackClass) card.className += ` ${feedbackClass}`;

            const badgeColor = q.type === 'HOLE' ? 'bg-purple-100 text-purple-800 border-purple-200' : 'bg-emerald-100 text-emerald-800 border-emerald-200';

            card.innerHTML = `
                <div class="space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] font-bold font-mono px-2.5 py-0.5 rounded-full border ${badgeColor}">
                            ${q.type === 'HOLE' ? 'AGUJERO' : 'EJE'}
                        </span>
                        <span class="text-[11px] font-mono text-slate-400 font-bold">Item ${idx + 1} / 10</span>
                    </div>

                    <h3 class="text-xs font-bold text-slate-800 leading-snug">${q.title}</h3>
                    <p class="text-[11px] text-slate-600 leading-relaxed">${q.desc}</p>

                    <div class="pt-1">
                        ${generate2DTechnicalDrawingSVG(q)}
                    </div>

                    <div class="space-y-1.5 pt-2 font-mono text-xs">
                        ${q.options.map(opt => {
                            const isChecked = selectedOpt === opt.id;
                            let btnStyle = "bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-700";

                            if (isChecked) {
                                btnStyle = "bg-blue-50 border-[#0067c0] text-[#0067c0] font-bold ring-1 ring-[#0067c0]";
                            }

                            if (isQuizSubmitted) {
                                if (opt.correct) {
                                    btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-900 font-bold";
                                } else if (isChecked && !opt.correct) {
                                    btnStyle = "bg-rose-100 border-rose-500 text-rose-900 font-bold line-through";
                                }
                            }

                            return `
                                <button onclick="selectQuizOption(${q.id}, '${opt.id}')" ${isQuizSubmitted ? 'disabled' : ''} 
                                    class="w-full text-left p-2.5 rounded-xl border transition flex items-center justify-between text-[11px] ${btnStyle}">
                                    <span><strong class="mr-1.5 text-slate-400">${opt.id})</strong> ${opt.text}</span>
                                    ${isChecked ? '<i data-lucide="check-circle-2" class="w-4 h-4 text-[#0067c0]"></i>' : ''}
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>

                ${isQuizSubmitted ? `
                    <div class="pt-2 border-t border-slate-200 text-[11px] text-slate-600 bg-slate-50 p-2.5 rounded-xl">
                        <strong class="text-slate-800 flex items-center gap-1 mb-1 font-sans">
                            <i data-lucide="info" class="w-3.5 h-3.5 text-[#0067c0]"></i> Justificación Técnica:
                        </strong>
                        <p class="leading-relaxed font-sans text-[10.5px]">${q.rationale}</p>
                    </div>
                ` : ''}
            `;

            container.appendChild(card);
        });

        lucide.createIcons();
    }

    window.selectQuizOption = function(qId, optId) {
        if (isQuizSubmitted) return;
        userQuizAnswers[qId] = optId;
        renderQuizEvaluation();
    };

    function gradeEvaluation() {
        let correctCount = 0;
        
        QUIZ_QUESTIONS.forEach(q => {
            const userAns = userQuizAnswers[q.id];
            const correctOpt = q.options.find(o => o.correct)?.id;
            if (userAns && userAns === correctOpt) {
                correctCount++;
            }
        });

        isQuizSubmitted = true;
        renderQuizEvaluation();

        const resultsBanner = document.getElementById('eval-results-banner');
        const scoreBadge = document.getElementById('eval-score-badge');
        const resultTitle = document.getElementById('eval-result-title');
        const resultSub = document.getElementById('eval-result-sub');
        const percentage = document.getElementById('eval-percentage');

        resultsBanner.classList.remove('hidden');

        const scorePercent = (correctCount / QUIZ_QUESTIONS.length) * 100;
        scoreBadge.textContent = `${correctCount}/${QUIZ_QUESTIONS.length}`;
        percentage.textContent = `${scorePercent}%`;

        if (correctCount >= 8) {
            resultTitle.textContent = "¡Excelente Desempeño Metrológico!";
            resultSub.textContent = "Has demostrado un dominio completo en la lectura e interpretación de tolerancias ISO 286 para agujeros y ejes.";
            scoreBadge.className = "w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-800 border border-emerald-300 flex items-center justify-center font-mono font-bold text-lg";
        } else if (correctCount >= 5) {
            resultTitle.textContent = "Aprobado - Nivel Intermedio";
            resultSub.textContent = "Buen trabajo. Revisa los items incorrectos y consulta la pestaña 'Tablas ISO' para reforzar los conceptos.";
            scoreBadge.className = "w-12 h-12 rounded-2xl bg-amber-100 text-amber-800 border border-amber-300 flex items-center justify-center font-mono font-bold text-lg";
        } else {
            resultTitle.textContent = "Requiere Repaso Técnico";
            resultSub.textContent = "Te sugerimos practicar en el Visor 3D de la pestaña 'Interpretación' y volver a intentar el cuestionario.";
            scoreBadge.className = "w-12 h-12 rounded-2xl bg-rose-100 text-rose-800 border border-rose-300 flex items-center justify-center font-mono font-bold text-lg";
        }
    }

    function restartEvaluation() {
        userQuizAnswers = {};
        isQuizSubmitted = false;
        document.getElementById('eval-results-banner').classList.add('hidden');
        renderQuizEvaluation();
    }

        bindDOMElements();

    function initThreeJS() {
        const width = threeContainer.clientWidth;
        const height = threeContainer.clientHeight;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf4f6f9);

        camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(100, 80, 120);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        threeContainer.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 400;
        controls.minDistance = 20;

        const axesCanvas = document.getElementById('axes-canvas');
        axesScene = new THREE.Scene();
        
        const axesSize = 1.8;
        axesCamera = new THREE.OrthographicCamera(-axesSize, axesSize, axesSize, -axesSize, 0.1, 10);
        axesCamera.position.set(0, 0, 4);

        axesRenderer = new THREE.WebGLRenderer({ canvas: axesCanvas, alpha: true, antialias: true });
        axesRenderer.setSize(80, 80);
        axesRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        axesHelper = new THREE.AxesHelper(0.9);
        axesScene.add(axesHelper);

        function createAxisLabel(text, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold 44px Consolas, monospace';
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 32, 32);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(0.45, 0.45, 1);
            return sprite;
        }

        const labelX = createAxisLabel('X', '#ef4444');
        labelX.position.set(1.25, 0, 0);
        axesScene.add(labelX);

        const labelY = createAxisLabel('Y', '#10b981');
        labelY.position.set(0, 1.25, 0);
        axesScene.add(labelY);

        const labelZ = createAxisLabel('Z', '#3b82f6');
        labelZ.position.set(0, 0, 1.25);
        axesScene.add(labelZ);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight1.position.set(100, 150, 100);
        dirLight1.castShadow = true;
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0x0067c0, 0.25);
        dirLight2.position.set(-100, -50, -100);
        scene.add(dirLight2);

        gridHelper = new THREE.GridHelper(200, 20, 0x0067c0, 0xd1d5db);
        gridHelper.position.y = -35;
        scene.add(gridHelper);

        modelGroup = new THREE.Group();
        dimensionGroup = new THREE.Group();
        scene.add(modelGroup);
        scene.add(dimensionGroup);

        window.addEventListener('resize', onWindowResize);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            axesCamera.position.copy(camera.position).sub(controls.target).setLength(4);
            axesCamera.lookAt(0, 0, 0);

            updateOverlayPosition();
            renderer.render(scene, camera);
            axesRenderer.render(axesScene, axesCamera);
        }
        animate();
    }

    function onWindowResize() {
        if (!threeContainer) return;
        const width = threeContainer.clientWidth;
        const height = threeContainer.clientHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
    }

    function updateOverlayPosition() {
        if (!cotaOverlay || !dimensionGroup) return;

        const list = state.currentType === 'HOLE' ? ISO_DATA.HOLES : ISO_DATA.SHAFTS;
        const currentPlan = list[state.selectedPlanIndex] || list[0];
        const nominal = state.nominalDiameter;
        const dev = calculateISODeviations(currentPlan.symbol, currentPlan.type, nominal);

        const signEs = dev.ES_um >= 0 ? '+' : '';
        const signEi = dev.EI_um >= 0 ? '+' : '';

        if (state.currentType === 'HOLE') {
            explainLetterText.innerHTML = `Letra mayúscula <strong>'${currentPlan.pos}'</strong> indica cota de <strong>AGUJERO</strong>. Posiciona el intervalo de tolerancia respecto a la Línea Cero (ZLN).`;
        } else {
            explainLetterText.innerHTML = `Letra minúscula <strong>'${currentPlan.pos}'</strong> indica cota de <strong>EJE</strong>. Establece la desviación fundamental respecto a la Línea Cero (ZLN).`;
        }

        explainNumberText.innerHTML = `El número <strong>'${currentPlan.it}'</strong> asigna una tolerancia IT${currentPlan.it} = <strong>${dev.IT_um} µm</strong> para la medida nominal Ø${nominal}mm.`;

        conditionLimitsDisplay.innerHTML = `${dev.dMin.toFixed(3)} mm ≤ <i>D</i><sub>real</sub> ≤ ${dev.dMax.toFixed(3)} mm`;

        if (state.currentType === 'HOLE') {
            gaugePassVal.textContent = `${dev.dMin.toFixed(3)} mm (Dmín)`;
            gaugeNoPassVal.textContent = `${dev.dMax.toFixed(3)} mm (Dmáx)`;
        } else {
            gaugePassVal.textContent = `${dev.dMax.toFixed(3)} mm (dmáx)`;
            gaugeNoPassVal.textContent = `${dev.dMin.toFixed(3)} mm (dmín)`;
        }

        industrialAppText.textContent = currentPlan.app;

        cotaOverlayText.innerHTML = `Ø${nominal}<sup class="${state.currentType === 'HOLE' ? 'text-purple-600' : 'text-emerald-600'} ml-0.5">${currentPlan.symbol}</sup>`;
        cotaOverlaySub.textContent = `${signEs}${dev.ES_mm.toFixed(3)} / ${signEi}${dev.EI_mm.toFixed(3)} mm`;

        const length = nominal * 1.5;
        let target3DPos = new THREE.Vector3();

        if (state.currentType === 'HOLE') {
            const frontZ = length / 2 + nominal * 0.3;
            target3DPos.set(0, 0, frontZ);
        } else {
            const xOffset = nominal * 1.1;
            target3DPos.set(xOffset, 0, 0);
        }

        const projectedVec = target3DPos.clone().project(camera);
        const rect = threeContainer.getBoundingClientRect();
        const x = (projectedVec.x * 0.5 + 0.5) * rect.width;
        const y = (-(projectedVec.y * 0.5) + 0.5) * rect.height;

        if (projectedVec.z < 1) {
            cotaOverlay.style.display = 'block';
            cotaOverlay.style.left = `${x}px`;
            cotaOverlay.style.top = `${y}px`;
        } else {
            cotaOverlay.style.display = 'none';
        }

        build3DModel(currentPlan, dev, nominal);
    }

    function build3DModel(plan, dev, nominal) {
        while(modelGroup.children.length > 0) { 
            modelGroup.remove(modelGroup.children[0]); 
        }
        while(dimensionGroup.children.length > 0) { 
            dimensionGroup.remove(dimensionGroup.children[0]); 
        }

        const radius = nominal / 2;
        const length = nominal * 1.5;
        const dimColor = 0x0067c0;
        const lineMat = new THREE.LineBasicMaterial({ color: dimColor, linewidth: 2 });
        const auxLineMat = new THREE.LineDashedMaterial({
            color: 0x64748b,
            dashSize: 2,
            gapSize: 1.5,
            linewidth: 1
        });
        const arrowHeight = 6;
        const capGeo = new THREE.ConeGeometry(2, arrowHeight, 12);
        const capMat = new THREE.MeshBasicMaterial({ color: dimColor });

        if (state.currentType === 'HOLE') {
            const outerSize = nominal * 1.8;
            
            const holeShape = new THREE.Shape();
            holeShape.moveTo(-outerSize/2, -outerSize/2);
            holeShape.lineTo(outerSize/2, -outerSize/2);
            holeShape.lineTo(outerSize/2, outerSize/2);
            holeShape.lineTo(-outerSize/2, outerSize/2);
            holeShape.lineTo(-outerSize/2, -outerSize/2);

            const holePath = new THREE.Path();
            holePath.absarc(0, 0, radius, 0, Math.PI * 2, true);
            holeShape.holes.push(holePath);

            const extrudeSettings = {
                depth: length,
                bevelEnabled: true,
                bevelSegments: 3,
                steps: 1,
                bevelSize: 1,
                bevelThickness: 1
            };

            const geometry = new THREE.ExtrudeGeometry(holeShape, extrudeSettings);
            geometry.center();

            const material = new THREE.MeshStandardMaterial({
                color: 0xc084fc,
                metalness: 0.4,
                roughness: 0.3,
                transparent: true,
                opacity: 0.5,
                depthWrite: false
            });

            const blockMesh = new THREE.Mesh(geometry, material);
            blockMesh.castShadow = false;
            blockMesh.receiveShadow = true;
            modelGroup.add(blockMesh);

            const sectionGeo = new THREE.CylinderGeometry(radius, radius, length + 0.2, 32, 1, true);
            const sectionMat = new THREE.MeshBasicMaterial({
                color: 0x0067c0,
                wireframe: true,
                transparent: true,
                opacity: 0.4
            });
            const sectionMesh = new THREE.Mesh(sectionGeo, sectionMat);
            sectionMesh.rotation.x = Math.PI / 2;
            modelGroup.add(sectionMesh);

            const frontZ = length / 2 + nominal * 0.3;

            const mainLinePoints = [
                new THREE.Vector3(0, -radius, frontZ),
                new THREE.Vector3(0, radius, frontZ)
            ];
            const mainLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(mainLinePoints), lineMat);
            dimensionGroup.add(mainLine);

            const extTopPoints = [
                new THREE.Vector3(0, radius, length / 2),
                new THREE.Vector3(0, radius, frontZ + 6)
            ];
            const extBottomPoints = [
                new THREE.Vector3(0, -radius, length / 2),
                new THREE.Vector3(0, -radius, frontZ + 6)
            ];

            const extTopLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(extTopPoints), auxLineMat);
            extTopLine.computeLineDistances();
            const extBottomLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(extBottomPoints), auxLineMat);
            extBottomLine.computeLineDistances();

            dimensionGroup.add(extTopLine);
            dimensionGroup.add(extBottomLine);

            const topCap = new THREE.Mesh(capGeo, capMat);
            topCap.position.set(0, radius - arrowHeight / 2, frontZ);
            dimensionGroup.add(topCap);

            const bottomCap = new THREE.Mesh(capGeo, capMat);
            bottomCap.position.set(0, -radius + arrowHeight / 2, frontZ);
            bottomCap.rotation.z = Math.PI;
            dimensionGroup.add(bottomCap);

        } else {
            const shaftGeo = new THREE.CylinderGeometry(radius, radius, length, 48);
            const shaftMat = new THREE.MeshStandardMaterial({
                color: 0x34d399,
                metalness: 0.5,
                roughness: 0.2,
                transparent: true,
                opacity: 0.5,
                depthWrite: false
            });

            const shaftMesh = new THREE.Mesh(shaftGeo, shaftMat);
            shaftMesh.rotation.z = Math.PI / 2;
            shaftMesh.castShadow = true;
            shaftMesh.receiveShadow = true;
            modelGroup.add(shaftMesh);

            const stepGeo = new THREE.CylinderGeometry(radius * 1.3, radius * 1.3, length * 0.3, 32);
            const stepMesh = new THREE.Mesh(stepGeo, shaftMat);
            stepMesh.rotation.z = Math.PI / 2;
            stepMesh.position.x = -length * 0.6;
            modelGroup.add(stepMesh);

            const xOffset = nominal * 1.1;

            const mainLinePoints = [
                new THREE.Vector3(xOffset, -radius, 0),
                new THREE.Vector3(xOffset, radius, 0)
            ];
            const mainLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(mainLinePoints), lineMat);
            dimensionGroup.add(mainLine);

            const margin = 6;
            const startX = length / 2;
            const extTopPoints = [
                new THREE.Vector3(startX, radius, 0),
                new THREE.Vector3(xOffset + margin, radius, 0)
            ];
            const extBottomPoints = [
                new THREE.Vector3(startX, -radius, 0),
                new THREE.Vector3(xOffset + margin, -radius, 0)
            ];

            const extTopLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(extTopPoints), auxLineMat);
            extTopLine.computeLineDistances();
            const extBottomLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(extBottomPoints), auxLineMat);
            extBottomLine.computeLineDistances();

            dimensionGroup.add(extTopLine);
            dimensionGroup.add(extBottomLine);

            const topCap = new THREE.Mesh(capGeo, capMat);
            topCap.position.set(xOffset, radius - arrowHeight / 2, 0);
            dimensionGroup.add(topCap);

            const bottomCap = new THREE.Mesh(capGeo, capMat);
            bottomCap.position.set(xOffset, -radius + arrowHeight / 2, 0);
            bottomCap.rotation.z = Math.PI;
            dimensionGroup.add(bottomCap);
        }
    }

    window.onload = function() {
        initApp();
        renderQuizEvaluation();
        lucide.createIcons();
    };
</script>
